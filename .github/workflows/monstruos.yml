name: Club de Monstruos - pruebas
on:
  pull_request:
    paths:
      - 'games/monstruos/**'
      - 'tests/games/monstruos/**'
      - 'tests/browser/monstruos.py'
      - '.github/workflows/monstruos.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reglas, contrato y arquitectura de todos los juegos
        run: npm test
      - name: Preparar navegador
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Club de Monstruos en teléfono y escritorio
        env:
          MONSTRUOS_SHOTS: screenshots
        run: |
          mkdir -p screenshots
          python tests/browser/monstruos.py
      - name: Capturas para revisión
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monstruos-screenshots
          path: screenshots/
          if-no-files-found: ignore
      - name: Prueba de navegador de toda la plataforma
        run: |
          python -m http.server 8765 > /tmp/http.log 2>&1 &
          python -u tests/browser/smoke.py
